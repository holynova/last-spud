<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%">
  <title>地牢幸存者 Dungeon Survivors — 类 Brotato 幸存者，活过 12 波迎战鼠王</title>
  <desc>Dungeon-brown hero: a lone adventurer surrounded by closing monsters, wave 12 boss Rat King banner above.</desc>
  <defs>
    <radialGradient id="torch" cx="70%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e8b04b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e8b04b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g>
    <rect width="1200" height="440" rx="16" fill="#171009"/>
    <rect width="1200" height="440" rx="16" fill="url(#torch)"/>
    <g fill="#241a10">
      <rect x="620" y="40" width="520" height="360" rx="12"/>
    </g>
    <g stroke="#2e2114" stroke-width="1">
      <line x1="620" y1="130" x2="1140" y2="130"/>
      <line x1="620" y1="220" x2="1140" y2="220"/>
      <line x1="620" y1="310" x2="1140" y2="310"/>
      <line x1="750" y1="40" x2="750" y2="400"/>
      <line x1="880" y1="40" x2="880" y2="400"/>
      <line x1="1010" y1="40" x2="1010" y2="400"/>
    </g>
  </g>
  <!-- left copy -->
  <g>
    <g>
      <rect x="60" y="52" width="250" height="32" rx="16" fill="#241a10" stroke="#c9a86a" stroke-width="1.2"/>
      <text x="185" y="74" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#e8b04b">BROTATO-LIKE · 幸存者</text>
    </g>
    <text x="60" y="152" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="800" fill="#f5e6c8">地牢幸存者</text>
    <text x="60" y="198" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="20" letter-spacing="3" fill="#c9a86a">DUNGEON SURVIVORS</text>
    <text x="60" y="240" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#d8c9a8">走位就是操作，活过 12 波，迎战鼠王</text>
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">
      <g>
        <rect x="60" y="278" width="110" height="44" rx="10" fill="#241a10" stroke="#c9a86a" stroke-width="1"/>
        <text x="115" y="307" text-anchor="middle" fill="#f5e6c8">12 波</text>
      </g>
      <g>
        <rect x="186" y="278" width="172" height="44" rx="10" fill="#241a10" stroke="#c9a86a" stroke-width="1"/>
        <text x="272" y="307" text-anchor="middle" fill="#f5e6c8">10 武器 × 4 阶</text>
      </g>
      <g>
        <rect x="374" y="278" width="132" height="44" rx="10" fill="#241a10" stroke="#c9a86a" stroke-width="1"/>
        <text x="440" y="307" text-anchor="middle" fill="#f5e6c8">6 主动技能</text>
      </g>
    </g>
    <text x="60" y="372" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#b3a284">纯原生 JS + Canvas，零依赖，无需构建</text>
  </g>
  <!-- right: arena scene -->
  <g>
    <!-- wave banner -->
    <g>
      <rect x="700" y="58" width="360" height="36" rx="18" fill="#171009" stroke="#c9a86a" stroke-width="1.2"/>
      <text x="880" y="82" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#f5e6c8">第 12 波 · 最终决战 · 鼠王</text>
    </g>
    <!-- enemies closing in -->
    <g>
      <!-- one-eyed monster top-left -->
      <g transform="translate(690, 150)">
        <circle cx="0" cy="0" r="22" fill="#5a7a4a" stroke="#3a5230" stroke-width="2"/>
        <circle cx="0" cy="-3" r="9" fill="#f5e6c8"/>
        <circle cx="0" cy="-3" r="4" fill="#171009"/>
        <rect x="-14" y="10" width="28" height="5" rx="2" fill="#3a5230"/>
      </g>
      <!-- bat top-right -->
      <g transform="translate(1075, 145)">
        <ellipse cx="-14" cy="0" rx="14" ry="7" fill="#6a5a8a"/>
        <ellipse cx="14" cy="0" rx="14" ry="7" fill="#6a5a8a"/>
        <circle cx="0" cy="0" r="13" fill="#7a6a9a"/>
        <circle cx="-5" cy="-2" r="2.5" fill="#f5e6c8"/>
        <circle cx="5" cy="-2" r="2.5" fill="#f5e6c8"/>
      </g>
      <!-- spider left -->
      <g transform="translate(672, 290)">
        <g stroke="#3a3a3a" stroke-width="2">
          <line x1="-14" y1="-10" x2="-22" y2="-18"/><line x1="14" y1="-10" x2="22" y2="-18"/>
          <line x1="-16" y1="2" x2="-26" y2="0"/><line x1="16" y1="2" x2="26" y2="0"/>
          <line x1="-12" y1="12" x2="-20" y2="20"/><line x1="12" y1="12" x2="20" y2="20"/>
        </g>
        <circle cx="0" cy="0" r="16" fill="#4a3a6a"/>
        <circle cx="-5" cy="-3" r="3" fill="#ff6b6b"/><circle cx="5" cy="-3" r="3" fill="#ff6b6b"/>
      </g>
      <!-- slime bottom-right -->
      <g transform="translate(1060, 300)">
        <ellipse cx="0" cy="0" rx="22" ry="17" fill="#5ad06e"/>
        <ellipse cx="0" cy="4" rx="16" ry="11" fill="#7ae08a"/>
        <circle cx="-7" cy="-4" r="3" fill="#171009"/><circle cx="7" cy="-4" r="3" fill="#171009"/>
      </g>
      <!-- brute bottom-left -->
      <g transform="translate(740, 340)">
        <rect x="-18" y="-16" width="36" height="32" rx="8" fill="#8a5a3a"/>
        <circle cx="-8" cy="-4" r="3" fill="#f5e6c8"/><circle cx="8" cy="-4" r="3" fill="#f5e6c8"/>
        <rect x="-10" y="6" width="20" height="4" rx="2" fill="#5a3a22"/>
      </g>
    </g>
    <!-- hero center with aura -->
    <g transform="translate(880, 240)">
      <circle cx="0" cy="0" r="58" fill="none" stroke="#e8b04b" stroke-width="2" stroke-dasharray="4 6" stroke-opacity="0.7"/>
      <circle cx="0" cy="0" r="44" fill="#e8b04b" fill-opacity="0.08"/>
      <!-- adventurer: hood + body + staff -->
      <g>
        <rect x="-13" y="-8" width="26" height="30" rx="8" fill="#4a7a9a"/>
        <circle cx="0" cy="-14" r="13" fill="#e8c890"/>
        <path d="M -14 -16 A 14 14 0 0 1 14 -16 L 14 -10 L -14 -10 Z" fill="#6a4a2a"/>
        <circle cx="-5" cy="-13" r="2" fill="#171009"/><circle cx="5" cy="-13" r="2" fill="#171009"/>
        <line x1="18" y1="-26" x2="18" y2="26" stroke="#8a6a3a" stroke-width="4" stroke-linecap="round"/>
        <circle cx="18" cy="-30" r="7" fill="#c9a86a" stroke="#e8b04b" stroke-width="2"/>
      </g>
      <!-- projectiles -->
      <g fill="#e8b04b">
        <circle cx="-52" cy="-30" r="5"/>
        <circle cx="56" cy="18" r="5"/>
        <circle cx="-30" cy="52" r="5"/>
      </g>
    </g>
    <!-- HP bar -->
    <g>
      <rect x="700" y="362" width="360" height="16" rx="8" fill="#171009" stroke="#3a2c18" stroke-width="1"/>
      <rect x="702" y="364" width="250" height="12" rx="6" fill="#5ad06e"/>
      <text x="880" y="376" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#171009">HP 42 / 60</text>
    </g>
  </g>
</svg>
